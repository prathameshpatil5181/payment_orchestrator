spring.application.name=orchestrator

server.servlet.context-path=/orbyte/orchestrator/api/v1
server.port=5001

app.environment=dev

#DB_CONFIG
spring.datasource.url=jdbc:postgresql://localhost:5432/orbit
spring.datasource.username=admin
spring.datasource.password=mypassword

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false


#Redis_config
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#euraka
eureka.client.serviceUrl.defaultZone= http://localhost:5004/eureka/
eureka.instance.hostname=localhost